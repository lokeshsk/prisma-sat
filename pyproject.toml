[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-sat"
version = "0.1.0"
description = "Python client and CLI to search, order, and download ASI PRISMA hyperspectral satellite data by AOI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.8.0",
    "numpy>=1.22.0",
    "rasterio>=1.3.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "shapely>=2.0.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
prisma-sat = "prisma_pilot.cli:run_cli"
download-prisma = "prisma_pilot.cli:run_cli"
