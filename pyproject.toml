[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-sat"
version = "0.2.0"
description = "Automated Python client and CLI to search, order, and download ASI PRISMA hyperspectral satellite data by AOI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Lokesh Shukla", email = "lokesh.skshukla@gmail.com" },
]
keywords = [
    "prisma",
    "hyperspectral",
    "satellite",
    "earth-observation",
    "remote-sensing",
    "asi",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "h5py>=3.8.0",
    "numpy>=1.22.0",
    "rasterio>=1.3.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "shapely>=2.0.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/lokeshsk/prisma-sat"
Repository = "https://github.com/lokeshsk/prisma-sat"
Issues = "https://github.com/lokeshsk/prisma-sat/issues"

[project.scripts]
prisma-sat = "prisma_pilot.cli:run_cli"
prismasat = "prisma_pilot.cli:run_cli"
download-prisma = "prisma_pilot.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["prisma_pilot*", "prisma_sat*"]
exclude = ["tests*", "downloads*"]
